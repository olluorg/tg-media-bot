name: Build & Release

# - push to master     -> Docker image `edge` + binaries as workflow artifacts
# - tag v*            -> Docker image (semver tags + latest) + GitHub Release with binaries
on:
  push:
    branches: [master, feat/voicy-stt]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---- standalone binaries (static, musl) -------------------------------------
  binary:
    needs: check
    name: Binary ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="tg-media-bot-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/tg-media-bot" "dist/$name/"
          cp README.md LICENSE .env.example "dist/$name/"
          cp packaging/tg-media-bot.service "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # ---- docker image: one native build per arch, then a multi-arch manifest -----
  docker:
    needs: check
    name: Docker ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push standard image by digest
        id: build-standard
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}-standard
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-standard
      - name: Build & push DPI image by digest
        id: build-dpi
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-dpi
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}-dpi
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-dpi
      - name: Export digests
        run: |
          mkdir -p "${{ runner.temp }}/digests/standard" "${{ runner.temp }}/digests/dpi"
          digest_std="${{ steps.build-standard.outputs.digest }}"
          digest_dpi="${{ steps.build-dpi.outputs.digest }}"
          touch "${{ runner.temp }}/digests/standard/${digest_std#sha256:}"
          touch "${{ runner.temp }}/digests/dpi/${digest_dpi#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-standard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/standard/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: digests-dpi-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/dpi/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker manifest
    runs-on: ubuntu-24.04
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/standard
          pattern: digests-standard-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/dpi
          pattern: digests-dpi-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Standard image manifest
      - id: meta-standard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Create standard manifest list
        working-directory: ${{ runner.temp }}/digests/standard
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta-standard.outputs.version }}"
      # DPI image manifest
      - id: meta-dpi
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-dpi
          tags: |
            type=ref,event=branch
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Create DPI manifest list
        working-directory: ${{ runner.temp }}/digests/dpi
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta-dpi.outputs.version }}"

  # ---- GitHub Release (tags only) ---------------------------------------------
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, docker-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
