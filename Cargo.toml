[package]
name = "tg-media-bot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight self-hosted Telegram media downloader bot (yt-dlp + ffmpeg), Rust rewrite"

[dependencies]
# Single-threaded runtime: the bot is pure I/O glue, the heavy lifting happens
# in yt-dlp/ffmpeg child processes.
tokio = { version = "1", features = ["rt", "macros", "process", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
